<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crow C++ Backend Test</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Crow C++ Backend Test</h1>
        
        <div class="section">
            <h2>GET Request Test</h2>
            <button id="getTestBtn">Test GET /api/hello</button>
            <div id="getResult" class="result"></div>
        </div>
        
        <div class="section">
            <h2>POST Request Test</h2>
            <div class="input-group">
                <input type="text" id="postInput" placeholder="Enter some text">
                <button id="postTestBtn">Test POST /api/echo</button>
            </div>
            <div id="postResult" class="result"></div>
        </div>
    </div>
    
    <script src="/test.js"></script>
</body>
</html>
