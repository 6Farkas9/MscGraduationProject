{% if rows and rows|length>0 %}
  <div class="rounded-lg border border-slate-200 overflow-hidden bg-white">
    {% for r in rows %}
      <button type="button"
              class="w-full text-left px-3 py-2 hover:bg-slate-50 border-b border-slate-100"
              onclick="addConcept('{{ r.uid }}','{{ r.name|e }}')">
        <div class="text-sm font-medium">{{ r.name }}</div>
        <div class="text-xs text-slate-500 font-mono">{{ r.uid }}</div>
      </button>
    {% endfor %}
  </div>
{% else %}
  {% if q %}
    <div class="text-xs text-slate-500">未找到匹配的知识点（关键词：{{ q }}）</div>
  {% endif %}
{% endif %}
