{% extends "portal_base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <div class="text-xl font-semibold">学习者登录</div>

    <form id="loginForm" class="mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">学习者 UID</label>
        <input id="uid" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">密码</label>
        <input id="pwd" type="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required />
      </div>
      <div class="flex items-center justify-between">
        <button type="submit" class="rounded-lg bg-slate-900 text-white px-4 py-2 hover:bg-slate-800">登录</button>
        <div id="err" class="text-sm text-red-600 hidden">密码错误</div>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const form = document.getElementById("loginForm");
  const err = document.getElementById("err");
  form.addEventListener("submit", function(e){
    e.preventDefault();
    const uid = document.getElementById("uid").value.trim();
    const pwd = document.getElementById("pwd").value;
    if (pwd === "123456"){
      localStorage.setItem("learner_uid", uid);
      window.location.href = "/ui/learner";
    } else {
      err.classList.remove("hidden");
    }
  });
})();
</script>
{% endblock %}
