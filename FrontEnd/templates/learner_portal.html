{% extends "portal_base.html" %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
  <div class="flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-lg font-semibold">学习者服务</div>
      </div>
      <div class="text-sm text-slate-600">
        当前学习者：<span id="top_uid" class="font-medium text-slate-900">未登录</span>
      </div>
    </div>

    <div class="flex flex-wrap gap-2">
      <a href="/ui/learner?view=ability" class="rounded-lg px-3 py-2 border {% if view=='ability' %}bg-slate-900 text-white border-slate-900{% else %}bg-white hover:bg-slate-50 border-slate-200{% endif %}">能力状态展示</a>
      <a href="/ui/learner?view=config" class="rounded-lg px-3 py-2 border {% if view=='config' %}bg-slate-900 text-white border-slate-900{% else %}bg-white hover:bg-slate-50 border-slate-200{% endif %}">服务调节状态展示</a>
      <a href="/ui/learner?view=resource" class="rounded-lg px-3 py-2 border {% if view=='resource' %}bg-slate-900 text-white border-slate-900{% else %}bg-white hover:bg-slate-50 border-slate-200{% endif %}">资源服务展示</a>
      <a href="/ui/learner?view=relation" class="rounded-lg px-3 py-2 border {% if view=='relation' %}bg-slate-900 text-white border-slate-900{% else %}bg-white hover:bg-slate-50 border-slate-200{% endif %}">关系服务展示</a>
    </div>
  </div>
</div>

<div class="mt-4 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
  <iframe id="contentFrame" src="{{ iframe_src }}" class="w-full" style="height: calc(100vh - 180px); border: 0;"></iframe>
</div>

<script>
(function(){
  const uid = localStorage.getItem("learner_uid");
  if (!uid){
    window.location.href = "/ui/login";
    return;
  }
  const topUid = document.getElementById("top_uid");
  if (topUid) topUid.textContent = uid;
})();
</script>
{% endblock %}
